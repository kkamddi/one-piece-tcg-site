<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Card Pone 로그인</title>
  </head>
  <body>
    <p id="status">로그인 페이지로 이동 중입니다.</p>
    <script>
      (() => {
        try {
          const rawUrl = new URLSearchParams(window.location.search).get('oauth');
          const oauthUrl = new URL(rawUrl || '');
          const isSupabaseAuth = oauthUrl.origin === 'https://omxrcqjmnsthxyvnunjj.supabase.co'
            && oauthUrl.pathname === '/auth/v1/authorize';
          if (!isSupabaseAuth) throw new Error('invalid OAuth URL');

          sessionStorage.setItem('card-pone:native-auth', '1');
          window.location.replace(oauthUrl.toString());
        } catch {
          document.getElementById('status').textContent = '로그인 요청을 확인할 수 없습니다. 앱으로 돌아가 다시 시도해 주세요.';
        }
      })();
    </script>
  </body>
</html>
