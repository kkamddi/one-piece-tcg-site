name: Cloudflare Pages deploy kickoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-pages-deploy-kickoff.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name optcgkorea-static --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
