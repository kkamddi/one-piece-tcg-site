name: Domestic card-show collector

on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domestic-card-show-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.CARD_SHOW_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector and publisher without network
        run: node --test test/card-show-collector.test.mjs test/card-show-publisher.test.mjs
      - name: Collect organizers' event data and update the published list
        run: node scripts/publishCardShows.mjs
      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domestic-card-show-review-${{ github.run_id }}
          path: artifacts/card-show-collection/latest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish card show data only
        id: publish
        shell: bash
        run: |
          git add src/data/card-show-events.auto.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update card show schedule'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
