name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mobile-release

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan tracked files for secrets
        run: node scripts/scan-tracked-secrets.mjs
