name: SNKRDUNK box products sync

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Catalog lookback window in days'
        required: false
        default: '21'
  schedule:
    # 09:20 KST
    - cron: '20 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync new Japanese box products
        run: node scripts/syncSnkrdunkBoxProducts.js --lookback-days "${{ inputs.lookback_days || '21' }}"

      - name: Commit product updates
        id: commit
        run: |
          if git diff --quiet -- src/data/box-market-items.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/box-market-items.js
          git commit -m "chore: sync SNKRDUNK box products"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Build production site
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Deploy changed catalog to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          npx wrangler@4 pages deploy dist --project-name optcgkorea-static --branch main --commit-hash "$(git rev-parse HEAD)"

      - name: Notify successful catalog update
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SNKRDUNK box products synced and deployed."

      - name: Notify failed catalog update
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SNKRDUNK box products sync failed. Check GitHub Actions."
