name: SNKRDUNK catalog sync

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Catalog lookback window in days'
        required: false
        default: '21'
  schedule:
    # 09:20 KST
    - cron: '20 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync new Japanese box products
        run: node scripts/syncSnkrdunkBoxProducts.js --lookback-days "${{ inputs.lookback_days || '21' }}"

      - name: Sync newly released Japanese card products
        run: node scripts/syncSnkrdunkOnePieceMarketCards.js --write --max-pages=8

      - name: Sync Japanese box prices
        run: node scripts/syncSnkrdunkBoxPrices.js

      - name: Sync popular card ranking
        run: node scripts/syncSnkrdunkPopularCards.js

      - name: Commit catalog updates
        id: commit
        run: |
          if git diff --quiet -- src/data/box-market-items.js src/data/box-market-prices.json src/data/snkrdunk-popular-cards.js src/data/market-cards.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/box-market-items.js src/data/box-market-prices.json src/data/snkrdunk-popular-cards.js src/data/market-cards.js
          git commit -m "chore: sync SNKRDUNK catalog"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify failed catalog update
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SNKRDUNK catalog sync failed. Check GitHub Actions."

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
