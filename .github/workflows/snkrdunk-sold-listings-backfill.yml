name: SNKRDUNK sold listings backfill

on:
  schedule:
    # Daily incremental trading-history refresh at 04:00 KST.
    - cron: "0 19 * * *"
    # Monthly one-year retry for approved cards that still have no daily history.
    - cron: "0 21 1 * *"
  push:
    branches:
      - main
    paths:
      - .github/backfill-triggers/sold-listings-approved-all.txt
  workflow_dispatch:
    inputs:
      scope:
        description: Target scope
        required: false
        default: approved
        type: choice
        options:
          - approved
          - all-jp
          - all-market
      missing_condition:
        description: Only collect cards missing this daily-history condition
        required: false
        default: none
        type: choice
        options:
          - none
          - any
          - single
          - psa10
          - either
      apparel_ids:
        description: Optional comma-separated SNKRDUNK apparel IDs
        required: false
        default: ""
      start_index:
        description: Zero-based target offset for resume
        required: false
        default: "0"
      card_limit:
        description: Number of cards to process. Use 0 for all remaining.
        required: false
        default: "0"
      max_pages:
        description: Used-listing pages per card. Use all to continue until SNKRDUNK has no more pages.
        required: false
        default: all
      history_source:
        description: History source endpoint
        required: false
        default: used-listings
        type: choice
        options:
          - used-listings
          - trading-histories
      trading_history_per_page:
        description: Trading-history rows per page
        required: false
        default: "12"
      trading_history_max_pages:
        description: Trading-history pages per card. 120 pages is 1440 visible rows.
        required: false
        default: "120"
      mode:
        description: Backfill storage mode
        required: false
        default: aggregate
        type: choice
        options:
          - aggregate
          - raw
      recent_raw_days:
        description: Raw recent trades to keep for recent history UI
        required: false
        default: "30"
      daily_days:
        description: Daily chart aggregate days to keep
        required: false
        default: "365"
      safety_max_pages:
        description: Safety cap used when max_pages is all.
        required: false
        default: "1000"
      delay_ms:
        description: Delay between SNKRDUNK page requests
        required: false
        default: "1000"
      history_chunk_size:
        description: Sold history rows per collector POST
        required: false
        default: "10"
      collector_url:
        description: Market collector endpoint
        required: false
        default: https://www.optcgkorea.com/api/market-collector

concurrency:
  group: snkrdunk-sold-listings-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backfill sold listings
        env:
          COLLECTOR_URL: ${{ github.event.inputs.collector_url || 'https://www.optcgkorea.com/api/market-collector' }}
          MARKET_COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
          SNKRDUNK_COOKIE: ${{ secrets.SNKRDUNK_COOKIE }}
          SNKRDUNK_AUTHORIZATION: ${{ secrets.SNKRDUNK_AUTHORIZATION }}
          SNKRDUNK_CSRF_TOKEN: ${{ secrets.SNKRDUNK_CSRF_TOKEN }}
          BACKFILL_SCOPE: ${{ github.event.inputs.scope || 'approved' }}
          BACKFILL_MISSING_CONDITION: ${{ github.event_name == 'schedule' && github.event.schedule == '0 21 1 * *' && 'any' || github.event.inputs.missing_condition || 'none' }}
          APPAREL_IDS: ${{ github.event.inputs.apparel_ids || '' }}
          BACKFILL_START_INDEX: ${{ github.event.inputs.start_index || '0' }}
          BACKFILL_CARD_LIMIT: ${{ github.event.inputs.card_limit || '0' }}
          BACKFILL_MODE: ${{ github.event.inputs.mode || 'aggregate' }}
          BACKFILL_RECENT_RAW_DAYS: ${{ github.event_name == 'schedule' && github.event.schedule == '0 21 1 * *' && '30' || github.event_name == 'schedule' && '7' || github.event.inputs.recent_raw_days || '30' }}
          BACKFILL_DAILY_DAYS: ${{ github.event_name == 'schedule' && github.event.schedule == '0 21 1 * *' && '365' || github.event_name == 'schedule' && '7' || github.event.inputs.daily_days || '365' }}
          SOLD_LISTING_MAX_PAGES: ${{ github.event.inputs.max_pages || 'all' }}
          SOLD_LISTING_SAFETY_MAX_PAGES: ${{ github.event.inputs.safety_max_pages || '1000' }}
          BACKFILL_TRADING_HISTORIES: ${{ (github.event_name == 'schedule' || github.event.inputs.history_source == 'trading-histories') && '1' || '0' }}
          TRADING_HISTORY_PER_PAGE: ${{ github.event.inputs.trading_history_per_page || '12' }}
          TRADING_HISTORY_MAX_PAGES: ${{ github.event_name == 'schedule' && github.event.schedule == '0 21 1 * *' && '120' || github.event_name == 'schedule' && '5' || github.event.inputs.trading_history_max_pages || '120' }}
          BACKFILL_DELAY_MS: ${{ github.event.inputs.delay_ms || '1000' }}
          BACKFILL_HISTORY_CHUNK_SIZE: ${{ github.event.inputs.history_chunk_size || '10' }}
          BACKFILL_PROGRESS_PATH: sold-listings-backfill-progress.jsonl
        run: npm run backfill:sold-listings

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="SNKRDUNK history refresh succeeded.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="SNKRDUNK backfill failed.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL
          Check SNKRDUNK_COOKIE if the error is 401/403."
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."

      - name: Upload progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sold-listings-backfill-progress
          path: sold-listings-backfill-progress.jsonl
          if-no-files-found: ignore
