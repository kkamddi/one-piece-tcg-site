name: PSA10 index history refresh

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Recent Trading History pages per index card
        required: false
        default: "5"
  schedule:
    # Daily 13:00 KST repair pass. The full daily history workflow remains primary.
    - cron: "0 4 * * *"

concurrency:
  group: market-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: budget
        uses: ./.github/actions/d1-budget
        with:
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ed82677cb22fd8679792f6cff73a00d6

      - name: Apply adaptive index refresh range
        env:
          D1_BUDGET_PROFILE: ${{ steps.budget.outputs.profile }}
          REQUESTED_MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
        run: |
          case "${D1_BUDGET_PROFILE:-critical}" in
            normal) pages="$REQUESTED_MAX_PAGES"; days=3 ;;
            conserve) pages=2; days=2 ;;
            critical|protect|*) pages=1; days=1 ;;
          esac
          echo "TRADING_HISTORY_MAX_PAGES=$pages" >> "$GITHUB_ENV"
          echo "BACKFILL_RECENT_RAW_DAYS=$days" >> "$GITHUB_ENV"
          echo "BACKFILL_DAILY_DAYS=$days" >> "$GITHUB_ENV"
          echo "MARKET_INDEX_REBUILD_WINDOW_DAYS=$days" >> "$GITHUB_ENV"
          echo "D1 ${D1_BUDGET_PROFILE} profile: index history pages=$pages days=$days"

      - name: Resolve index component cards
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { collectorIndexComponents } from "./src/data/market-index-components.js";
            const ids = [...new Set(collectorIndexComponents.map((item) => Number(item.apparelId)).filter(Boolean))];
            fs.appendFileSync(process.env.GITHUB_ENV, `APPAREL_IDS=${ids.join(",")}\nINDEX_COMPONENT_COUNT=${ids.length}\n`);
            console.log(`Resolved ${ids.length} PSA10 index component cards.`);
          '

      - name: Collect recent PSA10 index trading history
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          MARKET_COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
          SNKRDUNK_COOKIE: ${{ secrets.SNKRDUNK_COOKIE }}
          SNKRDUNK_AUTHORIZATION: ${{ secrets.SNKRDUNK_AUTHORIZATION }}
          SNKRDUNK_CSRF_TOKEN: ${{ secrets.SNKRDUNK_CSRF_TOKEN }}
          BACKFILL_SCOPE: approved
          BACKFILL_MISSING_CONDITION: none
          BACKFILL_START_INDEX: "0"
          BACKFILL_CARD_LIMIT: "0"
          BACKFILL_MODE: aggregate
          BACKFILL_REQUIRE_COMPLETE_DAILY_WINDOW: "1"
          BACKFILL_TRADING_HISTORIES: "1"
          TRADING_HISTORY_PER_PAGE: "12"
          BACKFILL_CONDITIONS: psa10
          BACKFILL_DELAY_MS: "750"
          BACKFILL_HISTORY_CHUNK_SIZE: "10"
          BACKFILL_PROGRESS_PATH: psa10-index-history-progress.jsonl
        run: |
          if [ -z "$MARKET_COLLECTOR_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Required collector or Cloudflare secret is missing."
            exit 1
          fi
          npm run backfill:sold-listings

      - name: Rebuild recent PSA10 market indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
        run: MARKET_INDEX_CONDITION=psa10 npm run rebuild:market-indexes

      - name: Read index refresh status
        id: status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
        run: |
          status_json=$(npx wrangler d1 execute optcgkorea-public-shadow --remote --json --command "
            with latest as (
              select max(point_date) as latest_trade_date
              from market_chart_daily_points
              where source = 'snkrdunk' and condition_key = 'psa10'
            )
            select latest.latest_trade_date,
                   (select count(distinct apparel_id) from market_chart_daily_points where source = 'snkrdunk' and condition_key = 'psa10' and point_date = latest.latest_trade_date) as traded_cards,
                   (select coalesce(sum(trade_count), 0) from market_chart_daily_points where source = 'snkrdunk' and condition_key = 'psa10' and point_date = latest.latest_trade_date) as trade_count,
                   (select point_date from market_index_daily_points where index_code = 'collector' and condition_key = 'psa10' order by point_date desc limit 1) as index_date,
                   (select index_value from market_index_daily_points where index_code = 'collector' and condition_key = 'psa10' order by point_date desc limit 1) as index_value
            from latest")
          STATUS_JSON="$status_json" node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(process.env.STATUS_JSON || "[]");
            const row = result?.[0]?.results?.[0] || {};
            const values = {
              latest_trade_date: row.latest_trade_date || "none",
              traded_cards: Number(row.traded_cards || 0),
              trade_count: Number(row.trade_count || 0),
              index_date: row.index_date || "none",
              index_value: Number(row.index_value || 0).toFixed(2)
            };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n") + "\n");
            console.log(values);
            const latest = Date.parse(`${values.latest_trade_date}T00:00:00Z`);
            const ageDays = Number.isFinite(latest) ? Math.floor((Date.now() - latest) / 86400000) : Infinity;
            if (ageDays > 2 || values.index_date !== values.latest_trade_date) {
              throw new Error(`PSA10 market data is stale: trade=${values.latest_trade_date}, index=${values.index_date}, age=${ageDays}d`);
            }
          '

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="PSA10 index history refresh failed.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL
          Check SNKRDUNK_COOKIE if the error is 401/403."
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
