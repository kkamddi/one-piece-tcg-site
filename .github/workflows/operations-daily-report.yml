name: Operations daily report

on:
  workflow_dispatch:
  schedule:
    # 09:10 KST
    - cron: "10 0 * * *"

concurrency:
  group: operations-daily-report
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Measure D1 usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 d1 info optcgkorea-public-shadow --json > d1-info.json

      - name: Build operations report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_INFO_PATH: d1-info.json
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: https://omxrcqjmnsthxyvnunjj.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Es05CnslUVmRqOeGehdMkA_pciWLFlD
          OPS_STATUS_OUTPUT: operations-status.json
          TELEGRAM_MESSAGE_OUTPUT: operations-telegram-message.txt
          IMMEDIATE_MESSAGE_OUTPUT: operations-immediate-message.txt
        run: node scripts/buildOperationsReport.js

      - name: Write workflow summary
        run: |
          {
            echo "### Operations report"
            echo '```json'
            cat operations-status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send daily Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message=$(cat operations-telegram-message.txt)
          keyboard='{"inline_keyboard":[[{"text":"GitHub Actions","url":"https://github.com/kkamddi/one-piece-tcg-site/actions"}]]}'
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "reply_markup=${keyboard}"

      - name: Notify Telegram on report failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          message="CARD Pone 운영 리포트 생성 실패
          Run: ${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || true
