name: SNKRDUNK sold listing kickoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snkrdunk-sold-listing-kickoff.yml"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for latest site deployment
        run: sleep 120

      - name: Collect sold listings for 706813
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi

          url="${COLLECTOR_URL}?scope=approved&limit=1&offset=0&concurrency=1&listingSnapshots=1&apparelIds=706813&soldListings=1&soldListingPages=1"
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$url"

      - name: Rebuild recent market indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
          MARKET_INDEX_REBUILD_WINDOW_DAYS: "14"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          node scripts/rebuildMarketIndexes.js
