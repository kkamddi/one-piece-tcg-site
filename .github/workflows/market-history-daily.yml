name: Daily market trading history

on:
  workflow_dispatch:
    inputs:
      conditions:
        description: Trading conditions to collect
        required: false
        default: "a,psa10"
      per_page:
        description: Recent trades requested per card
        required: false
        default: "50"
      max_pages:
        description: Trading History pages per card
        required: false
        default: "20"
      recent_days:
        description: Recent days retained and rebuilt during this run
        required: false
        default: "2"
      delay_ms:
        description: Delay between SNKRDUNK requests
        required: false
        default: "750"
      apparel_ids:
        description: Optional comma-separated SNKRDUNK apparel IDs for a focused repair
        required: false
        default: ""
  schedule:
    # 09:00 KST (GitHub often starts it 3-4 hours late).
    - cron: "0 0 * * *"
    # 17:00 KST retry: reruns only the shards that failed in today's earlier run, and nothing if it succeeded.
    - cron: "0 8 * * *"

concurrency:
  group: daily-market-trading-history
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  budget:
    name: Resolve D1 budget
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.budget.outputs.profile }}
      retry_shards: ${{ steps.retry.outputs.shards }}
      skip: ${{ steps.retry.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: retry
        name: Pick shards for the afternoon retry
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RETRY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 8 * * *' }}
        run: |
          if [ "$IS_RETRY" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          earlier=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow market-history-daily.yml --created ">=$today" --limit 20 \
            --json databaseId,conclusion,status --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and .status == \"completed\")] | first // empty | \"\\(.databaseId) \\(.conclusion)\"")
          if [ -z "$earlier" ]; then
            echo "No earlier run today; running every shard."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r run_id conclusion <<< "$earlier"
          if [ "$conclusion" = "success" ]; then
            echo "Run $run_id already succeeded today; nothing to retry."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shards=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion != "success" and (.name | startswith("Collect history"))) | .name | capture("\\((?<s>[^)]+)\\)").s] | join(",")')
          echo "Retrying shards from run $run_id: ${shards:-all}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      - id: budget
        uses: ./.github/actions/d1-budget
        with:
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ed82677cb22fd8679792f6cff73a00d6

  collect:
    name: Collect history (${{ matrix.shard_name }})
    needs: budget
    if: ${{ needs.budget.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard_name: 0-629
            shard_start: 0
            shard_limit: 630
          - shard_name: 630-1259
            shard_start: 630
            shard_limit: 630
          - shard_name: 1260-1889
            shard_start: 1260
            shard_limit: 630
          - shard_name: 1890-2519
            shard_start: 1890
            shard_limit: 630
          - shard_name: 2520-3149
            shard_start: 2520
            shard_limit: 630
          - shard_name: 3150-3779
            shard_start: 3150
            shard_limit: 630
          - shard_name: 3780-4409
            shard_start: 3780
            shard_limit: 630
          - shard_name: 4410-end
            shard_start: 4410
            shard_limit: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect recent Single and PSA10 trading history
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          MARKET_COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
          SNKRDUNK_COOKIE: ${{ secrets.SNKRDUNK_COOKIE }}
          SNKRDUNK_AUTHORIZATION: ${{ secrets.SNKRDUNK_AUTHORIZATION }}
          SNKRDUNK_CSRF_TOKEN: ${{ secrets.SNKRDUNK_CSRF_TOKEN }}
          APPAREL_IDS: ${{ github.event.inputs.apparel_ids || '' }}
          BACKFILL_SCOPE: scheduled
          BACKFILL_MISSING_CONDITION: none
          BACKFILL_START_INDEX: ${{ matrix.shard_start }}
          BACKFILL_CARD_LIMIT: ${{ matrix.shard_limit }}
          BACKFILL_MODE: aggregate
          BACKFILL_RECENT_RAW_DAYS: ${{ github.event.inputs.recent_days || '2' }}
          BACKFILL_DAILY_DAYS: ${{ github.event.inputs.recent_days || '2' }}
          BACKFILL_REPLACE_DAILY_WINDOW: "1"
          BACKFILL_REQUIRE_COMPLETE_DAILY_WINDOW: "1"
          BACKFILL_TRADING_HISTORIES: "1"
          TRADING_HISTORY_PER_PAGE: ${{ github.event.inputs.per_page || '50' }}
          TRADING_HISTORY_MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}
          BACKFILL_CONDITIONS: ${{ github.event.inputs.conditions || 'a,psa10' }}
          BACKFILL_DELAY_MS: ${{ github.event.inputs.delay_ms || '750' }}
          BACKFILL_HISTORY_CHUNK_SIZE: "20"
          BACKFILL_PROGRESS_PATH: daily-market-history-${{ matrix.shard_start }}.jsonl
          D1_BUDGET_PROFILE: ${{ needs.budget.outputs.profile }}
          SHARD_ORDINAL: ${{ strategy.job-index }}
          SHARD_NAME: ${{ matrix.shard_name }}
          RETRY_SHARDS: ${{ needs.budget.outputs.retry_shards }}
        run: |
          if [ -n "$RETRY_SHARDS" ] && [[ ",$RETRY_SHARDS," != *",$SHARD_NAME,"* ]]; then
            echo "Shard $SHARD_NAME succeeded in today's earlier run; not retried."
            exit 0
          fi
          if [ -z "$MARKET_COLLECTOR_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Required collector or Cloudflare secret is missing."
            exit 1
          fi
          if [ -z "$SNKRDUNK_COOKIE" ] && [ -z "$SNKRDUNK_AUTHORIZATION" ]; then
            echo "SNKRDUNK trading-history authentication is missing."
            exit 1
          fi
          utc_day=$((10#$(date -u +%s) / 86400))
          case "${D1_BUDGET_PROFILE:-critical}" in
            normal) divisor=1; slot=0 ;;
            conserve) divisor=2; slot=$((utc_day % 2)) ;;
            critical) divisor=4; slot=$((utc_day % 4)) ;;
            protect|*) divisor=8; slot=$((utc_day % 8)) ;;
          esac
          if [ -z "$RETRY_SHARDS" ] && [ $((10#$SHARD_ORDINAL % divisor)) -ne "$slot" ]; then
            echo "D1 ${D1_BUDGET_PROFILE} profile: history shard ${SHARD_ORDINAL} is deferred (slot ${slot}/${divisor})."
            exit 0
          fi
          npm run backfill:sold-listings

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-market-history-${{ matrix.shard_start }}
          path: daily-market-history-${{ matrix.shard_start }}.jsonl
          if-no-files-found: warn

  notify:
    name: Notify failed collection
    if: ${{ always() && needs.budget.outputs.skip != 'true' && needs.collect.result != 'success' }}
    needs: [budget, collect]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          IS_RETRY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 8 * * *' }}
          IS_MORNING: ${{ github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          failed=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" and (.name | startswith("Collect history"))) | .name | capture("\\((?<s>[^)]+)\\)").s] | join(", ")' || true)
          # The run is still in progress here, so read each failed collect job's own log.
          job_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
            --jq '.jobs[] | select(.conclusion == "failure" and (.name | startswith("Collect history"))) | .id' || true)
          secrets_expired=false
          for job_id in $job_ids; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" 2>/dev/null | grep -q "Refresh the GitHub Actions authentication secrets"; then
              secrets_expired=true
            fi
          done
          if [ "$secrets_expired" = "true" ]; then
            reason="SNKRDUNK login rejected for many cards in a row: the SNKRDUNK secrets need refreshing."
          else
            reason="Some cards could not be collected; see the run log."
          fi
          if [ "$IS_MORNING" = "true" ]; then
            next="The failed shards are retried automatically in the afternoon (17:00 KST schedule)."
          elif [ "$IS_RETRY" = "true" ]; then
            next="This was the afternoon retry; tomorrow's run also re-collects the last 2 days."
          else
            next=""
          fi
          message="Daily market trading history failed.
          Shards: ${failed:-unknown}
          Reason: ${reason}
          ${next}
          Run: ${RUN_URL}"
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"

      - name: Fail when collection failed
        run: exit 1
