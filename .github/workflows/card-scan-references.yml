name: Card scan reference refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * *'
permissions:
  contents: write
concurrency:
  group: card-scan-reference-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/d1-budget
        with:
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ed82677cb22fd8679792f6cff73a00d6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetchCardScanCatalog.mjs
        env:
          MARKET_COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
      - run: node scripts/generateCardImageIndex.mjs --catalog=tmp/card-scan-catalog.json
      - run: node scripts/buildCardScanManifest.mjs --catalog=tmp/card-scan-catalog.json
      - name: Publish reference data only
        id: publish
        shell: bash
        run: |
          git add public/card-scan
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update JP and EN card scan references'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
