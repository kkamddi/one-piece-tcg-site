name: Market index refresh

on:
  workflow_run:
    workflows:
      - SNKRDUNK sold listings backfill
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: Seconds to wait before rebuilding indexes
        required: false
        default: "900"
      rebuild_window_days:
        description: Index rebuild window days. Use 0 for full rebuild.
        required: false
        default: "14"

concurrency:
  group: market-index-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait after history collection
        env:
          INDEX_REBUILD_DELAY_SECONDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delay_seconds || '900' }}
        run: |
          delay="${INDEX_REBUILD_DELAY_SECONDS:-900}"
          if ! [[ "$delay" =~ ^[0-9]+$ ]]; then
            delay=900
          fi
          echo "Waiting ${delay}s before Single index rebuild."
          sleep "$delay"

      - name: Rebuild Single market indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
          MARKET_INDEX_CONDITION: a
          MARKET_INDEX_REBUILD_WINDOW_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rebuild_window_days || '14' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          npm run rebuild:market-indexes

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="PSA10 market index refresh succeeded.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="PSA10 market index refresh failed.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."
