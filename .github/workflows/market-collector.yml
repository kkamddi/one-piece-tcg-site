name: Market price collector

on:
  workflow_dispatch:
  schedule:
    # 03:17 / 09:17 / 15:17 / 21:17 KST
    - cron: "17 0,6,12,18 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Collect all JP market prices
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi

          offset=0
          limit=50
          for i in $(seq 1 120); do
            url="${COLLECTOR_URL}?scope=all-jp&limit=${limit}&offset=${offset}&concurrency=5"
            json=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$url")
            echo "$json"
            done_flag=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.done ? '1' : '0')" "$json")
            next_offset=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.nextOffset || 0)" "$json")
            if [ "$done_flag" = "1" ]; then
              break
            fi
            offset="$next_offset"
            sleep 2
          done
