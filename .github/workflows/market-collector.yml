name: Market price collector

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Collector scope
        required: false
        default: all-jp
        type: choice
        options:
          - approved
          - all-jp
          - all-en
          - all-market
      max_pages:
        description: Maximum 50-item pages to collect
        required: false
        default: "120"
      start_offset:
        description: Zero-based offset used to resume a manual run
        required: false
        default: "0"
      apparel_ids:
        description: Optional comma-separated SNKRDUNK apparel IDs for a focused run
        required: false
        default: ""
      collect_sold_listings:
        description: Collect sold used-listing trades during this run
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sold_listing_pages:
        description: Sold used-listing pages per card. Use "all" for backfill.
        required: false
        default: "1"
  schedule:
    # Four complete JP market refreshes per day.
    - cron: "17 0,6,12,18 * * *"

concurrency:
  group: market-price-collector
  cancel-in-progress: false

jobs:
  discover:
    name: Discover newly listed JP cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      added: ${{ steps.discover.outputs.added }}
      added_ids: ${{ steps.discover.outputs.added_ids }}
    steps:
      - id: discover
        name: Discover and snapshot new card products
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi
          json=$(curl -fsS --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "${COLLECTOR_URL}?action=discover")
          echo "$json"
          meta=$(node -e "
            const p = JSON.parse(process.argv[1]);
            if (!p.ok || !Number.isFinite(p.added)) process.exit(1);
            process.stdout.write([p.added, (p.addedIds || []).join(',')].join('|'));
          " "$json")
          IFS='|' read -r added added_ids <<< "$meta"
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "added_ids=$added_ids" >> "$GITHUB_OUTPUT"

  collect:
    name: Collect market prices (${{ matrix.shard_name }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard_id: 0
            shard_name: 0-1299
            shard_start: 0
            shard_stop: 1300
          - shard_id: 1
            shard_name: 1300-2599
            shard_start: 1300
            shard_stop: 2600
          - shard_id: 2
            shard_name: 2600-3899
            shard_start: 2600
            shard_stop: 3900
          - shard_id: 3
            shard_name: 3900-end
            shard_start: 3900
            shard_stop: 0
    steps:
      - uses: actions/checkout@v4

      - name: Collect market prices
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
          COLLECTOR_SCOPE: ${{ github.event.inputs.scope || 'all-jp' }}
          COLLECTOR_MAX_PAGES: ${{ github.event.inputs.max_pages || '120' }}
          COLLECTOR_START_OFFSET: ${{ github.event.inputs.start_offset || '0' }}
          SHARD_ID: ${{ matrix.shard_id }}
          SHARD_START: ${{ matrix.shard_start }}
          SHARD_STOP: ${{ matrix.shard_stop }}
          APPAREL_IDS: ${{ github.event.inputs.apparel_ids || '' }}
          COLLECT_SOLD_LISTINGS: ${{ github.event.inputs.collect_sold_listings || 'false' }}
          SOLD_LISTING_PAGES: ${{ github.event.inputs.sold_listing_pages || '1' }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi

          page_size=50
          base_limit=$page_size
          base_concurrency=4
          offset=$((10#$COLLECTOR_START_OFFSET))
          stop_offset=$((offset + (10#$COLLECTOR_MAX_PAGES * page_size)))

          if [ "$COLLECT_SOLD_LISTINGS" = "true" ]; then
            base_limit=10
            base_concurrency=2
          fi

          use_shards=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            use_shards=true
          elif [ "$COLLECTOR_START_OFFSET" = "0" ] && [ -z "$APPAREL_IDS" ]; then
            use_shards=true
          fi

          if [ "$use_shards" = "true" ]; then
            offset=$((10#$SHARD_START))
            stop_offset=$((10#$SHARD_STOP))
          elif [ "$SHARD_ID" != "0" ]; then
            echo "Focused or resumed manual run uses shard 0 only."
            exit 0
          fi

          max_requests=$((10#$COLLECTOR_MAX_PAGES * 5))
          request_count=0
          done_flag=0
          expected_total=0
          strict_fixed_range=false
          if [ "$use_shards" = "true" ] && [ "$COLLECTOR_SCOPE" = "all-jp" ] && [ -z "$APPAREL_IDS" ] && [ "$stop_offset" -gt 0 ]; then
            strict_fixed_range=true
          fi

          while [ "$request_count" -lt "$max_requests" ]; do
            if [ "$stop_offset" -gt 0 ] && [ "$offset" -ge "$stop_offset" ]; then
              break
            fi

            request_limit=$base_limit
            if [ "$stop_offset" -gt 0 ] && [ $((offset + request_limit)) -gt "$stop_offset" ]; then
              request_limit=$((stop_offset - offset))
            fi
            request_concurrency=$base_concurrency
            invalid_response_attempts=0

            while true; do
              url="${COLLECTOR_URL}?scope=${COLLECTOR_SCOPE}&limit=${request_limit}&offset=${offset}&concurrency=${request_concurrency}&listingSnapshots=1"
              if [ -n "$APPAREL_IDS" ]; then
                url="${url}&apparelIds=${APPAREL_IDS}"
              fi
              if [ "$COLLECT_SOLD_LISTINGS" = "true" ]; then
                url="${url}&soldListings=1&soldListingPages=${SOLD_LISTING_PAGES}"
              fi

              if json=$(curl -fsS --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors --connect-timeout 20 --max-time 120 -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$url"); then
                request_count=$((request_count + 1))
                if response_meta=$(node -e "
                  const p = JSON.parse(process.argv[1]);
                  const values = [p.offset, p.limit, p.total, p.nextOffset, p.collected, p.failed];
                  if (!values.every(Number.isFinite)) process.exit(2);
                  process.stdout.write([...values, p.done ? 1 : 0].join('|'));
                " "$json"); then
                  IFS='|' read -r response_offset response_limit response_total next_offset collected_count failed_count done_flag <<< "$response_meta"
                  invalid_reason=""

                  if [ "$response_offset" -ne "$offset" ]; then
                    invalid_reason="response offset mismatch: requested=$offset response=$response_offset"
                  elif [ "$response_limit" -le 0 ]; then
                    invalid_reason="invalid response limit: $response_limit"
                  elif [ "$response_total" -lt 0 ]; then
                    invalid_reason="invalid response total: $response_total"
                  elif [ "$next_offset" -lt "$offset" ]; then
                    invalid_reason="collector moved backwards: offset=$offset next_offset=$next_offset"
                  elif [ "$next_offset" -eq "$offset" ] && { [ "$done_flag" != "1" ] || [ "$response_total" -ne "$offset" ]; }; then
                    invalid_reason="collector did not advance: offset=$offset next_offset=$next_offset total=$response_total done=$done_flag"
                  elif [ "$collected_count" -ne $((next_offset - offset)) ]; then
                    invalid_reason="collected count mismatch: offset=$offset next_offset=$next_offset collected=$collected_count"
                  elif [ "$failed_count" -ne 0 ]; then
                    invalid_reason="collector reported failed items: offset=$offset failed=$failed_count"
                  fi

                  if [ "$COLLECTOR_SCOPE" = "all-jp" ] && [ -z "$APPAREL_IDS" ]; then
                    if [ "$response_total" -le 0 ]; then
                      invalid_reason="all-jp returned an empty target set"
                    elif [ "$expected_total" -eq 0 ]; then
                      expected_total=$response_total
                    elif [ "$response_total" -ne "$expected_total" ]; then
                      invalid_reason="all-jp target total changed: expected=$expected_total response=$response_total"
                    fi
                  fi

                  if [ "$strict_fixed_range" = "true" ] && [ "$done_flag" = "1" ] && [ "$next_offset" -lt "$stop_offset" ]; then
                    invalid_reason="collector reported done before shard end: next_offset=$next_offset stop_offset=$stop_offset"
                  fi

                  if [ -z "$invalid_reason" ]; then
                    break
                  fi
                else
                  invalid_reason="collector returned malformed JSON metadata"
                fi

                invalid_response_attempts=$((invalid_response_attempts + 1))
                echo "$json"
                echo "Invalid collector response at offset=$offset ($invalid_response_attempts/5): $invalid_reason"
                if [ "$invalid_response_attempts" -ge 5 ]; then
                  echo "Collector response validation failed at offset=$offset."
                  exit 1
                fi
              else
                invalid_reason="collector request failed"
              fi

              if [ "$request_limit" -gt 25 ]; then
                request_limit=25
                request_concurrency=3
              elif [ "$request_limit" -gt 10 ]; then
                request_limit=10
                request_concurrency=2
              elif [ "$request_limit" -gt 5 ]; then
                request_limit=5
                request_concurrency=1
              elif [ "$request_limit" -gt 1 ]; then
                request_limit=1
                request_concurrency=1
              elif [ "$invalid_reason" = "collector request failed" ]; then
                echo "Collector failed at offset=$offset after adaptive retries."
                exit 1
              fi
              echo "$invalid_reason at offset=$offset; retrying limit=$request_limit concurrency=$request_concurrency after cooldown."
              sleep 30
            done

            echo "$json"
            offset="$next_offset"
            if [ "$done_flag" = "1" ]; then
              break
            fi
            sleep 3
          done

          if [ "$strict_fixed_range" = "true" ] && [ "$offset" -lt "$stop_offset" ]; then
            echo "Collector stopped before completing its fixed shard range at offset=$offset stop_offset=$stop_offset."
            exit 1
          fi
          if [ "$strict_fixed_range" != "true" ] && [ "$done_flag" != "1" ] && { [ "$stop_offset" -eq 0 ] || [ "$offset" -lt "$stop_offset" ]; }; then
            echo "Collector stopped before completing its assigned range at offset=$offset."
            exit 1
          fi
          echo "Collector coverage complete: shard=$SHARD_ID offset=$offset stop_offset=$stop_offset total=$expected_total done=$done_flag requests=$request_count"

  evaluate-alerts:
    name: Evaluate price alerts
    needs: collect
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate registered price alerts
        env:
          ALERT_EVALUATOR_URL: https://www.optcgkorea.com/api/price-alerts?action=evaluate
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi
          json=$(curl -fsS --retry 10 --retry-delay 15 --retry-max-time 300 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -X POST -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$ALERT_EVALUATOR_URL")
          echo "$json"
          node -e "const p=JSON.parse(process.argv[1]); if (!p.ok) process.exit(1)" "$json"

  notify-new-cards:
    name: Notify newly discovered cards
    needs: discover
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.added != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADDED: ${{ needs.discover.outputs.added }}
          ADDED_IDS: ${{ needs.discover.outputs.added_ids }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="New SNKRDUNK JP cards added: ${ADDED}
          Apparel IDs: ${ADDED_IDS}
          Run: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."

  notify-failure:
    name: Notify Telegram on failure
    needs:
      - discover
      - collect
      - evaluate-alerts
    if: ${{ always() && (needs.discover.result == 'failure' || needs.collect.result == 'failure' || needs.evaluate-alerts.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="Market price collector failed.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."
