name: Market price collector

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Collector scope
        required: false
        default: all-jp
        type: choice
        options:
          - approved
          - all-jp
          - all-en
          - all-market
      max_pages:
        description: Maximum 50-item pages to collect
        required: false
        default: "120"
      index_rebuild_window_days:
        description: Index rebuild window days. Use 0 for full rebuild.
        required: false
        default: "0"
      apparel_ids:
        description: Optional comma-separated SNKRDUNK apparel IDs for a focused run
        required: false
        default: ""
      collect_sold_listings:
        description: Collect sold used-listing trades during this run
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sold_listing_pages:
        description: Sold used-listing pages per card. Use "all" for backfill.
        required: false
        default: "1"
  schedule:
    # 03:17 / 09:17 / 15:17 / 21:17 KST
    - cron: "17 0,6,12,18 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Collect market prices
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
          COLLECTOR_SCOPE: ${{ github.event.inputs.scope || 'all-jp' }}
          COLLECTOR_MAX_PAGES: ${{ github.event.inputs.max_pages || '120' }}
          APPAREL_IDS: ${{ github.event.inputs.apparel_ids || '' }}
          COLLECT_SOLD_LISTINGS: ${{ github.event.inputs.collect_sold_listings || 'false' }}
          SOLD_LISTING_PAGES: ${{ github.event.inputs.sold_listing_pages || '1' }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi

          offset=0
          limit=50
          for i in $(seq 1 "$COLLECTOR_MAX_PAGES"); do
            url="${COLLECTOR_URL}?scope=${COLLECTOR_SCOPE}&limit=${limit}&offset=${offset}&concurrency=5&listingSnapshots=1"
            if [ -n "$APPAREL_IDS" ]; then
              url="${url}&apparelIds=${APPAREL_IDS}"
            fi
            if [ "$COLLECT_SOLD_LISTINGS" = "true" ]; then
              url="${url}&soldListings=1&soldListingPages=${SOLD_LISTING_PAGES}"
            fi
            json=$(curl -fsS --retry 10 --retry-delay 15 --retry-max-time 300 --retry-all-errors --connect-timeout 20 --max-time 120 -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$url")
            echo "$json"
            done_flag=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.done ? '1' : '0')" "$json")
            next_offset=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.nextOffset || 0)" "$json")
            if [ "$done_flag" = "1" ]; then
              break
            fi
            offset="$next_offset"
            sleep 2
          done

      - name: Collect approved listing floor snapshots
        if: ${{ github.event_name == 'schedule' || github.event.inputs.apparel_ids == '' }}
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi

          offset=0
          limit=50
          max_pages=30
          for i in $(seq 1 "$max_pages"); do
            url="${COLLECTOR_URL}?scope=approved&limit=${limit}&offset=${offset}&concurrency=4&listingSnapshots=1&soldListings=1&soldListingPages=1"
            if ! json=$(curl -fsS --retry 10 --retry-delay 15 --retry-max-time 300 --retry-all-errors --connect-timeout 20 --max-time 120 -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$url"); then
              echo "Approved snapshot collection failed; continuing to index rebuild."
              break
            fi
            echo "$json"
            done_flag=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.done ? '1' : '0')" "$json")
            next_offset=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.nextOffset || 0)" "$json")
            if [ "$done_flag" = "1" ]; then
              break
            fi
            offset="$next_offset"
            sleep 2
          done

      - name: Rebuild market indexes
        if: ${{ github.event_name == 'schedule' || github.event.inputs.scope != 'all-en' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed82677cb22fd8679792f6cff73a00d6
          D1_DATABASE_ID: da59fbad-d4bb-4f4a-88cc-37b0a698646a
          MARKET_INDEX_CONDITION: a
          MARKET_INDEX_REBUILD_WINDOW_DAYS: ${{ github.event.inputs.index_rebuild_window_days || '0' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          node scripts/rebuildMarketIndexes.js

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="Market price collector failed.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."
