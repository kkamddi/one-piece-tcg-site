name: Market price collector

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Collector scope
        required: false
        default: all-jp
        type: choice
        options:
          - approved
          - all-jp
          - all-en
          - all-market
      max_pages:
        description: Maximum 50-item pages to collect
        required: false
        default: "120"
      start_offset:
        description: Zero-based offset used to resume a manual run
        required: false
        default: "0"
      apparel_ids:
        description: Optional comma-separated SNKRDUNK apparel IDs for a focused run
        required: false
        default: ""
      collect_sold_listings:
        description: Collect sold used-listing trades during this run
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sold_listing_pages:
        description: Sold used-listing pages per card. Use "all" for backfill.
        required: false
        default: "1"
  schedule:
    # Four complete JP market refreshes per day.
    - cron: "17 0,6,12,18 * * *"

concurrency:
  group: market-price-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect market prices (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard_id: 0
            shard_name: 0-1299
            shard_start: 0
            shard_stop: 1300
          - shard_id: 1
            shard_name: 1300-2599
            shard_start: 1300
            shard_stop: 2600
          - shard_id: 2
            shard_name: 2600-3899
            shard_start: 2600
            shard_stop: 3900
          - shard_id: 3
            shard_name: 3900-end
            shard_start: 3900
            shard_stop: 0
    steps:
      - uses: actions/checkout@v4

      - name: Collect market prices
        env:
          COLLECTOR_URL: https://www.optcgkorea.com/api/market-collector
          COLLECTOR_TOKEN: ${{ secrets.MARKET_COLLECTOR_TOKEN }}
          COLLECTOR_SCOPE: ${{ github.event.inputs.scope || 'all-jp' }}
          COLLECTOR_MAX_PAGES: ${{ github.event.inputs.max_pages || '120' }}
          COLLECTOR_START_OFFSET: ${{ github.event.inputs.start_offset || '0' }}
          SHARD_ID: ${{ matrix.shard_id }}
          SHARD_START: ${{ matrix.shard_start }}
          SHARD_STOP: ${{ matrix.shard_stop }}
          APPAREL_IDS: ${{ github.event.inputs.apparel_ids || '' }}
          COLLECT_SOLD_LISTINGS: ${{ github.event.inputs.collect_sold_listings || 'false' }}
          SOLD_LISTING_PAGES: ${{ github.event.inputs.sold_listing_pages || '1' }}
        run: |
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo "MARKET_COLLECTOR_TOKEN secret is missing."
            exit 1
          fi

          page_size=50
          base_limit=$page_size
          base_concurrency=4
          offset=$((10#$COLLECTOR_START_OFFSET))
          stop_offset=$((offset + (10#$COLLECTOR_MAX_PAGES * page_size)))

          if [ "$COLLECT_SOLD_LISTINGS" = "true" ]; then
            base_limit=10
            base_concurrency=2
          fi

          use_shards=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            use_shards=true
          elif [ "$COLLECTOR_START_OFFSET" = "0" ] && [ -z "$APPAREL_IDS" ]; then
            use_shards=true
          fi

          if [ "$use_shards" = "true" ]; then
            offset=$((10#$SHARD_START))
            stop_offset=$((10#$SHARD_STOP))
          elif [ "$SHARD_ID" != "0" ]; then
            echo "Focused or resumed manual run uses shard 0 only."
            exit 0
          fi

          max_requests=$((10#$COLLECTOR_MAX_PAGES * 5))
          request_count=0
          done_flag=0
          while [ "$request_count" -lt "$max_requests" ]; do
            if [ "$stop_offset" -gt 0 ] && [ "$offset" -ge "$stop_offset" ]; then
              break
            fi

            request_limit=$base_limit
            if [ "$stop_offset" -gt 0 ] && [ $((offset + request_limit)) -gt "$stop_offset" ]; then
              request_limit=$((stop_offset - offset))
            fi
            request_concurrency=$base_concurrency

            while true; do
              url="${COLLECTOR_URL}?scope=${COLLECTOR_SCOPE}&limit=${request_limit}&offset=${offset}&concurrency=${request_concurrency}&listingSnapshots=1"
              if [ -n "$APPAREL_IDS" ]; then
                url="${url}&apparelIds=${APPAREL_IDS}"
              fi
              if [ "$COLLECT_SOLD_LISTINGS" = "true" ]; then
                url="${url}&soldListings=1&soldListingPages=${SOLD_LISTING_PAGES}"
              fi

              if json=$(curl -fsS --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors --connect-timeout 20 --max-time 120 -H "Authorization: Bearer ${COLLECTOR_TOKEN}" "$url"); then
                break
              fi

              if [ "$request_limit" -gt 25 ]; then
                request_limit=25
                request_concurrency=3
              elif [ "$request_limit" -gt 10 ]; then
                request_limit=10
                request_concurrency=2
              else
                echo "Collector failed at offset=$offset after adaptive retries."
                exit 1
              fi
              echo "Collector unavailable at offset=$offset; retrying limit=$request_limit concurrency=$request_concurrency after cooldown."
              sleep 30
            done

            request_count=$((request_count + 1))
            echo "$json"
            done_flag=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.done ? '1' : '0')" "$json")
            next_offset=$(node -e "const p=JSON.parse(process.argv[1]); console.log(p.nextOffset || 0)" "$json")
            if [ "$done_flag" = "1" ]; then
              break
            fi
            if [ "$next_offset" -le "$offset" ]; then
              echo "Collector did not advance: offset=$offset next_offset=$next_offset"
              exit 1
            fi
            offset="$next_offset"
            sleep 3
          done

          if [ "$done_flag" != "1" ] && { [ "$stop_offset" -eq 0 ] || [ "$offset" -lt "$stop_offset" ]; }; then
            echo "Collector stopped before completing its assigned range at offset=$offset."
            exit 1
          fi

  notify-failure:
    name: Notify Telegram on failure
    needs: collect
    if: ${{ always() && needs.collect.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          message="Market price collector failed.
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" || echo "Telegram notification failed."
