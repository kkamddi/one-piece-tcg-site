name: Daily article publish
on:
  workflow_dispatch:
  schedule:
    # 07:05, 12:05 and 18:05 KST, just after each article slot in lib/articles.js (ARTICLE_SLOT_TIMES).
    # GitHub can delay or drop scheduled runs; the next run catches up, and deploying twice is harmless.
    - cron: '5 22 * * *'
    - cron: '5 3 * * *'
    - cron: '5 9 * * *'
permissions:
  contents: read
concurrency:
  group: articles-daily-publish
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Articles become live by date and slot time alone; this redeploy refreshes their pre-rendered HTML and the sitemap.
      - name: Find articles due today
        id: due
        shell: bash
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          count=$(node --input-type=module -e "
            import fs from 'node:fs';
            const dir = 'src/data/articles';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((name) => name.endsWith('.json')) : [];
            console.log(files.filter((name) => JSON.parse(fs.readFileSync(dir + '/' + name, 'utf8')).meta?.publishAt === '${today}').length);
          ")
          echo "Articles due ${today}: ${count}"
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] || [ "${count}" -gt 0 ]; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: check
    if: needs.check.outputs.due == 'true'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
