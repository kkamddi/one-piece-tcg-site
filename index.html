    <script>
      (() => {
        const retryKey = 'card-pone:boot-retry';
        document.documentElement.classList.add('card-pone-js-booting');
        window.__CARD_PONE_BOOT_TIMER__ = window.setTimeout(() => {
          const url = new URL(window.location.href);
          let alreadyRetried = url.searchParams.has('_app_retry');
          try {
            if (!alreadyRetried) alreadyRetried = sessionStorage.getItem(retryKey) === '1';
          } catch {
            // Some privacy modes block session storage. The URL marker still prevents a reload loop.
          }
          if (!alreadyRetried) {
            try {
              sessionStorage.setItem(retryKey, '1');
            } catch {
              // Continue with the URL-based retry marker.
            }
            url.searchParams.set('_app_retry', Date.now().toString());
            window.location.replace(url.toString());
            return;
          }
          document.documentElement.classList.remove('card-pone-js-booting');
          document.documentElement.classList.add('card-pone-js-boot-failed');
          const bootContent = document.querySelector('.card-pone-boot-content');
          if (bootContent && !bootContent.querySelector('.card-pone-boot-error')) {
            const error = document.createElement('p');
            error.className = 'card-pone-boot-error';
            error.innerHTML = '사이트를 불러오지 못했습니다.<br />잠시 후 다시 시도해 주세요.';
            const retry = document.createElement('button');
            retry.className = 'card-pone-boot-retry';
            retry.type = 'button';
            retry.textContent = '다시 시도';
            retry.addEventListener('click', () => window.location.reload());
            bootContent.append(error, retry);
          }
        }, 10000);
      })();
    </script>
    <style id="card-pone-server-page-critical">
      html { background: #f7f7f5; }

      .card-pone-boot-error,

      .card-pone-boot-error {

      .card-pone-boot-retry {

        background: #17191d;
        color: #fff;
        font: inherit;

        font-weight: 800;
        cursor: pointer;
      }
      html.card-pone-js-boot-failed .card-pone-boot-spinner { display: none; }
      html.card-pone-js-boot-failed .card-pone-boot-error,
      html.card-pone-js-boot-failed .card-pone-boot-retry { display: block; }
      html.card-pone-js-booting .server-page-content,

      @keyframes card-pone-boot-spin { to { transform: rotate(360deg); } }

    <script>
      (() => {
        const marker = 'card-pone:native-auth';
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const hasAuthResult = query.has('code') || query.has('error') || hash.has('access_token') || hash.has('error');
        if (sessionStorage.getItem(marker) !== '1' || !hasAuthResult) return;

        sessionStorage.removeItem(marker);
        const callback = new URL('com.optcgkorea.cardpone://auth/callback');
        callback.search = window.location.search;
        callback.hash = window.location.hash;
        window.location.replace(callback.toString());
      })();
    </script>
